<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marulas Studio</title>
<meta name="description" content="Marulas Studio — Android uygulamaları.">
<style>
  :root { color-scheme: light dark; --ink: #111; --paper: #fff; --muted: #666; --line: #e3e3e3; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f2f2f2; --paper: #000; --muted: #9a9a9a; --line: #2a2a2a; } }
  html { background: var(--paper); }
  body { margin: 0; padding: 48px 16px 64px; font: 17px/1.55 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 20px; margin: 32px 0 4px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); }
  a { color: inherit; }
  .app { padding: 16px 0; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>Marulas Studio</h1>
  <p class="muted">Android uygulamaları · Android apps</p>

  <div class="app">
    <h2>GramSet: Kalori &amp; Antrenman</h2>
    <p>Türk yemekleriyle beslenme + ağırlık antrenmanı tek uygulamada. Ücretsiz, reklamsız, veriler cihazında.</p>
    <p><a href="gramset/privacy/">Gizlilik politikası</a> · <a href="gramset/privacy/en.html">Privacy policy</a></p>
  </div>

  <p class="muted">İletişim · Contact: <a href="mailto:gramset.app@gmail.com">gramset.app@gmail.com</a></p>
</main>
</body>
</html>
